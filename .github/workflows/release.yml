name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write # required for GITHUB_TOKEN to create releases and upload assets

jobs:
  # ── Build all three platforms in parallel ───────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: dist:mac
            build_args: --universal
            artifact_name: mac-build
            artifact_path: dist/*.dmg
          - os: windows-latest
            build_cmd: dist:win
            build_args: ""
            artifact_name: win-build
            artifact_path: dist/*.exe
          - os: ubuntu-latest
            build_cmd: dist:linux
            build_args: ""
            artifact_name: linux-build
            artifact_path: dist/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 xvfb
          # libasound2 was renamed to libasound2t64 in Ubuntu 22.04+
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Build
        env:
          # Signing: CSC_LINK overrides keychain discovery; empty on PRs = unsigned build.
          # Required GitHub secrets (set in repo Settings → Secrets → Actions):
          #   APPLE_CERTIFICATE            - base64-encoded Developer ID Application .p12
          #   APPLE_CERTIFICATE_PASSWORD   - password for the .p12
          #   APPLE_ID                     - Apple Developer account email
          #   APPLE_APP_SPECIFIC_PASSWORD  - app-specific password from appleid.apple.com
          #   APPLE_TEAM_ID                - 10-char Team ID from developer.apple.com/account
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # When APPLE_CERTIFICATE is unset, electron-builder still treats the empty
        # CSC_LINK as "sign with this empty path" and fails. Force `mac.identity=null`
        # in that case so the macOS build is unsigned and continues. When a real
        # certificate IS configured, the conditional drops the override and signing
        # proceeds normally.
        # `shell: bash` is needed on Windows — the default PowerShell runner can't
        # parse the conditional. Git Bash is bundled on the windows-latest image.
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            EXTRA="-c.mac.identity=null"
          fi
          npm run ${{ matrix.build_cmd }} -- --publish never ${{ matrix.build_args }} $EXTRA

      - name: Smoke test – app launch (Linux only)
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            npx electron --no-sandbox . &
          APP_PID=$!
          sleep 8
          kill "$APP_PID" 2>/dev/null
          wait "$APP_PID" 2>/dev/null
          EXIT_CODE=$?
          # Killed processes return 143 (SIGTERM) which is expected
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 143 ]; then
            echo "Smoke test: app exited unexpectedly with code $EXIT_CODE"
            exit 1
          fi
          echo "Smoke test passed (app launched and ran for 8 s)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ── After all builds succeed, create the GitHub Release (tags only) ─────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: "See CHANGELOG.md for what's new in this release."
          files: release-files/*
          make_latest: true

  # ── After the release is published, nudge mailwing.app to rebuild ───────────
  refresh-site:
    name: Refresh mailwing.app
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::CLOUDFLARE_PAGES_DEPLOY_HOOK is not set — skipping site refresh."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK_URL"
          echo "Pages rebuild requested."
