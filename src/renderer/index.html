<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailwing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Left sidebar: account avatars + service tabs -->
  <aside id="sidebar">
    <div id="account-list"></div>
    <button id="add-account-btn" title="Add account" aria-label="Add account">+</button>
    <div id="sidebar-hint" class="hidden" aria-hidden="true">Add your first account</div>
    <div class="divider"></div>
    <div id="service-list"></div>
    <div class="sidebar-bottom">
      <button id="report-bug-btn" title="Report a Bug" aria-label="Report a Bug">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="13" r="4"/>
          <path d="M11 9V7"/>
          <path d="M7 9H4M18 9h-3"/>
          <path d="M5.5 5.5l2 2M16.5 5.5l-2 2"/>
          <path d="M4 14H7M15 14h3"/>
          <path d="M5.5 18.5l2-2M16.5 18.5l-2-2"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Right content area: shown when no BrowserView is active -->
  <main id="content-area">
    <div id="welcome-screen">
      <div class="welcome-icon">✉</div>
      <h1 class="welcome-title">Welcome to Mailwing</h1>
      <p class="welcome-sub">Your multi-provider email client</p>
      <div class="welcome-providers" id="welcome-providers"></div>
      <p class="welcome-hint">You can also click <strong>+</strong> in the sidebar at any time</p>
    </div>
  </main>

  <!-- Bug report modal -->
  <div id="bug-report-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="bug-modal-title">
    <div class="modal-dialog">
      <h2 id="bug-modal-title" class="modal-title">Report a Bug</h2>

      <label class="modal-label" for="bug-title">Short description</label>
      <input id="bug-title" class="modal-input" type="text" placeholder="e.g. App crashes when adding an account" maxlength="100">

      <label class="modal-label" for="bug-steps">Steps to reproduce</label>
      <textarea id="bug-steps" class="modal-textarea" placeholder="1. Open the app&#10;2. Click...&#10;3. ..."></textarea>

      <label class="modal-label" for="bug-expected">Expected behavior</label>
      <textarea id="bug-expected" class="modal-textarea modal-textarea-sm" placeholder="What should have happened?"></textarea>

      <label class="modal-label" for="bug-actual">Actual behavior</label>
      <textarea id="bug-actual" class="modal-textarea modal-textarea-sm" placeholder="What actually happened?"></textarea>

      <div class="modal-sysinfo" id="bug-sysinfo">Loading system info…</div>

      <div class="modal-actions">
        <a class="modal-link" id="bug-view-issues" href="#">View existing issues</a>
        <div class="modal-btns">
          <button class="modal-btn modal-btn-cancel" id="bug-cancel">Cancel</button>
          <button class="modal-btn modal-btn-submit" id="bug-submit">Open in GitHub</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Provider picker popup (replaces native OS add-account menu) -->
  <div id="provider-picker-backdrop" class="hidden"></div>
  <div id="provider-picker" class="hidden" role="menu" aria-label="Add account">
    <div class="provider-picker-title">Add account</div>
    <div id="provider-picker-list"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
